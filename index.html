<style>
  :root{
    --page:#dfe6d8;
    --chatbg:#eef1ea;
    --header:#34432f;
    --header-ink:#f4f1e6;
    --header-ink-dim:rgba(244,241,230,.72);
    --bubble:#ffffff;
    --bubble-ink:#2c352a;
    --bubble-dim:rgba(44,53,42,.56);
    --accent:#c76b83;
    --accent-ink:#fff7f8;
    --line:rgba(44,53,42,.1);
    --ring:rgba(44,53,42,.08);
    --green:#2bab6b;
    --green-dark:#1f7d4e;
    font-family:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--page);
    color:var(--bubble-ink);
    display:flex;
  }
  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-inline:16px;
    padding-block:20px;
    width:100%;
  }
  .phone{
    position:relative;
    width:min(400px,100%);
    height:min(800px, 100%);
    max-height:820px;
    border-radius:26px;
    overflow:hidden;
    background:var(--chatbg);
    box-shadow:0 26px 60px rgba(30,40,25,.28), 0 0 0 1px rgba(255,255,255,.4);
    display:flex;
    flex-direction:column;
  }

  }
  .cover.dismissed{opacity:0;visibility:hidden;pointer-events:none;}
  .cover-scrim{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(8,14,9,.3) 0%, rgba(8,14,9,.12) 30%, rgba(8,14,9,.16) 42%, rgba(8,14,9,.2) 55%, rgba(6,11,7,.8) 100%);
  }

  .cover-names-wrap{
    position:absolute;
    left:0; right:0; top:6%;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:0 20px;
  }
  .cover-names{
    font-family:'Ballet',cursive;
    font-weight:400;
    color:#fff;
    text-shadow:0 4px 24px rgba(0,0,0,.5);
  }
  .cover-names .cn-line{
    display:block;
    font-size:64px;
    line-height:1.2;
  }
  .cover-names .cn-amp{
    display:block;
    font-size:26px;
    line-height:1.6;
    opacity:.85;
  }
  .cover-flourish{
    margin-top:10px;
    width:132px;height:14px;
    opacity:.92;
  }

  .cover-inner{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:1;
    width:100%;max-width:440px;
    margin:0 auto;
    padding:0 24px calc(48px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .cover-sub{
    font:600 11px/1.5 Inter,sans-serif;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.9);
  }
  .launcher{
    position:relative;
    margin-top:26px;
    width:64px;height:64px;border-radius:50%;
    background:var(--green);
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 28px rgba(0,0,0,.4);
  }
  .launcher-ring{
    position:absolute;inset:-8px;border-radius:50%;
    border:2px solid rgba(43,171,107,.6);
    animation:launchpulse 2.2s ease-out infinite;
  }
  @keyframes launchpulse{0%{transform:scale(.82);opacity:1;}75%,100%{transform:scale(1.42);opacity:0;}}
  .launcher-bubble{width:27px;height:20px;background:#fff;border-radius:7px;position:relative;}
  .launcher-bubble::after{
    content:"";position:absolute;left:8px;bottom:-6px;
    border:6px solid transparent;border-top-color:#fff;
  }
  .launcher-dots{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3px;}
  .launcher-dots i{width:4px;height:4px;border-radius:50%;background:var(--green);display:block;}
  .launcher-badge{
    position:absolute;top:-5px;right:-5px;
    min-width:21px;height:21px;padding:0 5px;
    border-radius:11px;
    background:#e6435a;
    color:#fff;
    font:800 11.5px/21px Inter,sans-serif;
    text-align:center;
    box-shadow:0 2px 7px rgba(0,0,0,.4), 0 0 0 2.5px var(--header, #34432f);
  }
  .taphint{
    margin-top:15px;
    font:600 11px/1 Inter,sans-serif;letter-spacing:.06em;
    color:rgba(255,255,255,.88);
  }
  @media (prefers-reduced-motion: reduce){ .launcher-ring{animation:none;opacity:0;} }

  .head{
    background:var(--header);
    color:var(--header-ink);
    padding:16px 16px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    flex:0 0 auto;
  }
  .avatar{
    width:40px;height:40px;border-radius:50%;
    background:linear-gradient(155deg,#5c7154,#34432f);
    display:flex;align-items:center;justify-content:center;
    font:600 13px/1 Inter,sans-serif;
    letter-spacing:.02em;
    flex:0 0 auto;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .headtext{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .headname{font:700 15px/1.2 Inter,sans-serif;}
  .headstatus{font:500 12px/1.2 Inter,sans-serif;color:var(--header-ink-dim);}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8fd19e;margin-right:5px;}
  .muteBtn{
    margin-left:auto;
    flex:0 0 auto;
    width:32px;height:32px;border-radius:50%;
    border:none;background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--header-ink);
    padding:0;
  }
  .muteBtn svg{width:16px;height:16px;display:block;}

  .msgs{
    flex:1 1 auto;
    overflow-y:auto;
    padding:18px 14px 10px;
    display:flex;
    flex-direction:column;
    gap:3px;
    scroll-behavior:smooth;
  }
  .msgs::-webkit-scrollbar{width:0;}

  .row{display:flex;width:100%;margin-top:9px;}
  .row.in{justify-content:flex-start;}
  .row.out{justify-content:flex-end;}
  .row.center{justify-content:center;}

  .bubble{
    max-width:78%;
    padding:9px 13px;
    font:400 14.5px/1.42 Inter,sans-serif;
    background:var(--bubble);
    color:var(--bubble-ink);
    border-radius:16px;
    box-shadow:0 1px 1px var(--ring);
  }
  .row.in .bubble{border-bottom-left-radius:4px;}
  .row.out .bubble{
    border-bottom-right-radius:4px;
    background:var(--accent);
    color:var(--accent-ink);
  }
  .meta{
    display:block;
    margin-top:3px;
    font:500 10.5px/1 Inter,sans-serif;
    color:var(--bubble-dim);
    text-align:right;
  }
  .row.out .meta{color:rgba(255,247,248,.8);}
  .ticks{margin-left:4px;letter-spacing:-2px;color:#5aa6c9;}
  .row.out .ticks{color:#eaf9ff;}

  /* ---- In-chat invitation card (Save-the-Date style) ---- */
  .invite-card{
    max-width:88%;
    background:#f7f1e6;
    border-radius:16px;
    padding:22px 18px 18px;
    text-align:center;
    box-shadow:0 1px 1px var(--ring);
  }
  .invite-headline{
    font-family:'Petit Formal Script',cursive;
    font-size:32px;
    line-height:1.15;
    color:#4a3626;
  }
  .invite-caps{
    margin-top:8px;
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:12.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#6b5744;
  }
  .invite-caps-first{margin-top:0;}
  .invite-date{
    margin-top:6px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
    color:#8a6a3f;
  }
  .invite-cd{
    margin-top:15px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:6px;
  }
  .invite-cd .cd-box{
    min-width:44px;
    padding:7px 4px 6px;
    background:rgba(74,54,38,.07);
    border-radius:8px;
  }
  .invite-cd .cd-n{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:19px;
    line-height:1;
    color:#4a3626;
    font-variant-numeric:tabular-nums;
  }
  .invite-cd .cd-u{
    margin-top:3px;
    font:600 7.5px/1 Inter,sans-serif;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#8a7a63;
  }
  .invite-cd .cd-sep{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:17px;
    color:rgba(74,54,38,.28);
    padding-top:7px;
  }
  .invite-frame{
    margin-top:14px;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(74,54,38,.18);
  }
  .invite-frame img{width:100%;display:block;}
  .invite-tag{
    margin-top:12px;
    font:600 9.5px/1 Inter,sans-serif;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#8a7a63;
  }

  .card{
    max-width:80%;
    background:var(--bubble);
    border-radius:16px;
    border-bottom-left-radius:4px;
    overflow:hidden;
    box-shadow:0 1px 1px var(--ring);
  }
  .card .map{
    height:76px;
    background:
      repeating-linear-gradient(0deg, rgba(52,67,47,.09) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, rgba(52,67,47,.09) 0 1px, transparent 1px 22px),
      #dfe7d7;
    position:relative;
  }
  .card .map::after{
    content:"";
    position:absolute;left:50%;top:50%;width:14px;height:14px;
    transform:translate(-50%,-90%);
    background:var(--accent);
    border-radius:50% 50% 50% 0;
    rotate:-45deg;
    box-shadow:0 0 0 4px rgba(199,107,131,.2);
  }
  .card .cardbody{padding:10px 13px 12px;}
  .card .cardtitle{font:700 13.5px/1.3 Inter,sans-serif;}
  .card .cardsub{margin-top:2px;font:400 12.5px/1.3 Inter,sans-serif;color:var(--bubble-dim);}
  .card a.cardlink{
    display:block;
    margin-top:8px;
    font:700 12px/1 Inter,sans-serif;
    color:#3f6ea3;
    text-decoration:none;
  }

  .count-face{padding:26px 18px;text-align:center;background:linear-gradient(155deg,#eef6ee,#dbeee0);}

  .count-face .u{margin-top:6px;font:700 10.5px/1 Inter,sans-serif;letter-spacing:.14em;color:#3d8058;text-transform:uppercase;}

  .dresscode-img{width:100%;display:block;background:#f3f1e9;}

  .proglist{margin-top:9px;display:flex;flex-direction:column;gap:9px;}
  .progrow{display:flex;align-items:flex-start;gap:9px;}
  .progheart{width:12px;height:12px;flex:0 0 auto;margin-top:3px;color:var(--green-dark);}
  .progline{font:400 13px/1.4 Inter,sans-serif;color:var(--bubble-ink);}
  .progline b{font-weight:700;color:var(--green-dark);}

  .typing{
    background:var(--bubble);
    border-radius:16px;
    border-bottom-left-radius:4px;
    padding:12px 15px;
    display:inline-flex;
    gap:4px;
    box-shadow:0 1px 1px var(--ring);
  }
  .typing i{
    width:6px;height:6px;border-radius:50%;
    background:var(--bubble-dim);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2){animation-delay:.15s;}
  .typing i:nth-child(3){animation-delay:.3s;}

    align-self:center;
    margin:6px auto 10px;
    padding:4px 12px;
    background:rgba(44,53,42,.08);
    border-radius:999px;
    font:600 10.5px/1 Inter,sans-serif;
    letter-spacing:.04em;
    color:var(--bubble-dim);
  }

  .quickwrap{
    flex:0 0 auto;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));

    background:var(--chatbg);
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    min-height:24px;
  }
  .chip{
    flex:1 1 auto;
    padding:11px 14px;
    border-radius:999px;
    border:1.5px solid var(--accent);
    background:transparent;
    color:#8a3a52;
    font:700 13px/1 Inter,sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .chip:disabled{opacity:.4;}

  .composer{display:flex;align-items:center;gap:8px;width:100%;}
  .wishinput{
    flex:1 1 auto;min-width:0;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:999px;
    padding:10px 16px;
    font:400 14px/1.3 Inter,sans-serif;
    color:var(--bubble-ink);
    outline:none;
  }
  .wishinput::placeholder{color:var(--bubble-dim);}
  .wishinput:focus{border-color:var(--accent);}
  .sendbtn{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;
    border:none;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    padding:0;
  }
  .sendbtn svg{width:16px;height:16px;}
  .sendbtn:disabled{opacity:.4;cursor:default;}

    .cover-names .cn-line{font-size:56px;}
    .cover-names .cn-amp{font-size:22px;}

    {type:'in', text:'G\u0259l\u0259 bil\u0259rsinizmi?', time:'12:42', showChips:true}
  ];

  function scrollBottom(){ msgsEl.scrollTop = msgsEl.scrollHeight; }

  function addRow(cls, inner){
    var row = document.createElement('div');
    row.className = 'row ' + cls;
    row.innerHTML = inner;
    msgsEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function daysLeftInfo(){
    var target = new Date(2026,9,17,18,0,0);
    var now = new Date();
    var days = Math.ceil((target - now) / 86400000);
    if(days > 1) return {n: days, u: 'g\u00fcn qal\u0131b'};
    if(days === 1) return {n: '1', u: 'g\u00fcn qal\u0131b'};
    if(days === 0) return {n: '\u2728', u: 'bu g\u00fcn!'};
    return {n: '\u2713', u: 'ke\u00e7di'};
  }

  var cdStarted = false;
  function startCountdown(){
    if(cdStarted) return;
    cdStarted = true;
    var target = new Date(2026,9,17,18,0,0).getTime();
    var dEl = document.getElementById('cdD'),
        hEl = document.getElementById('cdH'),
        mEl = document.getElementById('cdM'),
        sEl = document.getElementById('cdS');
    if(!dEl) return;
    function pad(n){ n = String(n); return n.length < 2 ? '0'+n : n; }
    function tick(){
      var diff = target - Date.now();
      if(diff < 0) diff = 0;
      var totalSec = Math.floor(diff/1000);
      var d = Math.floor(totalSec/86400);
      var h = Math.floor((totalSec%86400)/3600);
      var m = Math.floor((totalSec%3600)/60);
      var s = totalSec%60;
      dEl.textContent = pad(d);
      hEl.textContent = pad(h);
      mEl.textContent = pad(m);
      sEl.textContent = pad(s);
    }
    tick();
    setInterval(tick, 1000);
  }

  function renderStep(step){
    if(step.type === 'day'){
      var d = document.createElement('div');
      d.className = 'daychip';
      d.textContent = 'Bu g\u00fcn';
      msgsEl.appendChild(d);
      return;
    }
    if(step.type === 'in'){
      addRow('in', '<div class="bubble">'+step.text+(step.time?'<span class="meta">'+step.time+'</span>':'')+'</div>');
      return;
    }
    if(step.type === 'invite'){
      addRow('center',
        '<div class="invite-card">'+
          '<div class="invite-caps invite-caps-first">Biz evl\u0259nirik</div>'+
          '<div class="invite-date">17 Oktyabr 2026</div>'+
          '<div class="invite-cd">'+
            '<div class="cd-box"><div class="cd-n" id="cdD">00</div><div class="cd-u">g\u00fcn</div></div>'+
            '<div class="cd-sep">:</div>'+
            '<div class="cd-box"><div class="cd-n" id="cdH">00</div><div class="cd-u">saat</div></div>'+
            '<div class="cd-sep">:</div>'+
            '<div class="cd-box"><div class="cd-n" id="cdM">00</div><div class="cd-u">d\u0259q</div></div>'+
            '<div class="cd-sep">:</div>'+
            '<div class="cd-box"><div class="cd-n" id="cdS">00</div><div class="cd-u">san</div></div>'+
          '</div>'+
          '<div class="invite-frame"><img src="'+FRAME_URI+'" alt="G\u00fcnay v\u0259 Polad"></div>'+
        '</div>');
      startCountdown();
      return;
    }
    if(step.type === 'card'){
      addRow('in', '<div class="card"><div class="map" aria-hidden="true"></div><div class="cardbody"><div class="cardtitle">'+step.title+'</div><div class="cardsub">'+step.sub+'</div><a class="cardlink no-nav" href="'+step.href+'" target="_blank" rel="noopener">Xəritədə aç ↗</a>'+(step.time?'<span class="meta">'+step.time+'</span>':'')+'</div></div>');
      return;
    }
    if(step.type === 'countdown'){
      var di = daysLeftInfo();
      addRow('in', '<div class="card"><div class="count-face"><div class="n">'+di.n+'</div><div class="u">'+di.u+'</div></div></div>');
      return;
    }
    if(step.type === 'dresscode'){
      addRow('in', '<div class="card"><img class="dresscode-img" src="'+DRESS_URI+'" alt="Dress code"><div class="cardbody"><div class="cardtitle">Dress code</div><div class="cardsub">Z\u0259rif \u00e7\u0259hray\u0131-q\u0131z\u0131l\u0131 tonlar \ud83d\udc97</div></div></div>');
      return;
    }
    if(step.type === 'program'){
      var heart = '<svg class="progheart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.2C0.3 8.6 2 5 5.7 5c2.2 0 3.9 1.2 6.3 4 2.4-2.8 4.1-4 6.3-4 3.7 0 5.4 3.6 3.7 6.8C19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>';
      var items = [
        ['18:00','Qonaqlar\u0131n qar\u015f\u0131lanmas\u0131'],
        ['19:00','B\u0259y v\u0259 g\u0259linin g\u0259li\u015fi'],
        ['20:00','Canl\u0131 musiqi'],
        ['22:00','Tort k\u0259silm\u0259si'],
        ['23:00 \u2013 00:00','DJ il\u0259 \u0259yl\u0259nc\u0259']
      ];
      var rows = items.map(function(it){
        return '<div class="progrow">'+heart+'<div class="progline"><b>'+it[0]+'</b> \u2014 '+it[1]+'</div></div>';
      }).join('');
      addRow('in', '<div class="card"><div class="cardbody"><div class="cardtitle">Toyun Proqram\u0131</div><div class="proglist">'+rows+'</div></div></div>');
      return;
    }
  }

  function showTyping(){
    return addRow('in', '<div class="typing"><i></i><i></i><i></i></div>');
  }

  var i = 0;
  function next(){
    if(i >= script.length){ return; }
    var step = script[i++];
    if(step.type === 'day' || step.type === 'invite'){
      renderStep(step);
      window.setTimeout(next, reduced ? 0 : 320);
      return;
    }
    if(reduced){
      renderStep(step);
      if(step.showChips) revealChips();
      next();
      return;
    }
    var t = showTyping();
    var typeDelay = 700 + Math.min(step.text ? step.text.length*18 : 380, 900);
    window.setTimeout(function(){
      t.remove();
      renderStep(step);
      if(step.showChips) revealChips();
      if(step.showComposer) showComposer();
      window.setTimeout(next, 420);
    }, typeDelay);
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var SEND_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/></svg>';

  function showComposer(){
    quickEl.innerHTML =
      '<div class="composer">'+
        '<input type="text" id="wishInput" class="wishinput" maxlength="200" placeholder="Ürək sözlərinizi yazın…">'+
        '<button class="sendbtn no-nav" id="sendWish" type="button" aria-label="Göndər">'+SEND_ICON+'</button>'+
      '</div>';
    var input = document.getElementById('wishInput');
    var btn = document.getElementById('sendWish');
    var replied = false;
    function doSend(){
      var val = input.value.trim();
      if(!val) return;
      addRow('out', '<div class="bubble">'+escapeHtml(val)+'<span class="meta">indi <span class="ticks">✓✓</span></span></div>');
      input.value = '';
      if(!replied){
        replied = true;
        window.setTimeout(function(){
          var t = showTyping();
          window.setTimeout(function(){
            t.remove();
            addRow('in', '<div class="bubble">Bu xoş sözlər üçün təşəkkür edirik 🤍</div>');
          }, 1100);
        }, reduced ? 0 : 350);
      }
    }
    btn.addEventListener('click', doSend);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); doSend(); }
    });
  }

  function revealChips(){
    quickEl.innerHTML =
      '<button class="chip primary no-nav" data-a="yes" type="button">G\u0259l\u0259 bil\u0259r\u0259m \ud83d\udc9a</button>'+
      '<button class="chip no-nav" data-a="no" type="button">G\u0259l\u0259 bilm\u0259r\u0259m</button>';
    quickEl.querySelectorAll('.chip').forEach(function(btn){
      btn.addEventListener('click', function(){ onChip(btn.dataset.a); });
    });
  }

  function onChip(answer){
    quickEl.querySelectorAll('.chip').forEach(function(b){ b.disabled = true; });
    var label = answer === 'yes' ? 'G\u0259l\u0259 bil\u0259r\u0259m \ud83d\udc9a' : 'G\u0259l\u0259 bilm\u0259r\u0259m';
    addRow('out', '<div class="bubble">'+label+'<span class="meta">indi <span class="ticks">\u2713\u2713</span></span></div>');
    window.setTimeout(function(){ quickEl.innerHTML=''; }, reduced ? 0 : 500);

    if(answer === 'yes'){
      script.push(
        {type:'program'},
        {type:'dresscode'},
        {type:'in', text:'Biz\u0259 g\u00f6r\u0259 \u0259n b\u00f6y\u00fck h\u0259diyy\u0259 sizin orada olman\u0131zd\u0131r. G\u00f6r\u00fc\u015f\u0259n\u0259d\u0259k \ud83e\udd0d'},
        {type:'in', text:'\u0130st\u0259s\u0259niz, biz\u0259 bir ne\u00e7\u0259 \u00fcr\u0259k s\u00f6z\u00fc yaza bil\u0259rsiniz \ud83d\udc8c', showComposer:true}
      );
    } else {
      script.push(
        {type:'in', text:'Ba\u015fa d\u00fc\u015f\u00fcr\u00fck, x\u0259b\u0259r verdiyiniz \u00fc\u00e7\u00fcn t\u0259\u015f\u0259kk\u00fcrl\u0259r. \u00dcr\u0259yimiz sizinl\u0259dir \ud83d\udc9b'},
        {type:'in', text:'\u0130st\u0259s\u0259niz, yen\u0259 d\u0259 biz\u0259 bir ne\u00e7\u0259 s\u00f6z yaza bil\u0259rsiniz \ud83d\udc8c', showComposer:true}
      );
    }
    window.setTimeout(next, reduced ? 0 : 500);
  }

  function playDing(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      if(ctx.state === 'suspended'){ ctx.resume(); }
      var now = ctx.currentTime;
      function tone(freq, start, dur, peak){
        var osc = ctx.createOscillator();
        var g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0, now + start);
        g.gain.linearRampToValueAtTime(peak, now + start + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(now + start);
        osc.stop(now + start + dur + 0.03);
      }
      tone(1318.5, 0, 0.16, 0.18);
      tone(1760, 0.11, 0.26, 0.15);
    }catch(e){}
  }

  var bgm = document.getElementById('bgm');
  var BGM_TARGET = 0.2;
  function fadeInMusic(){
    var t0 = null;
    function step(ts){
      if(!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / 1800);
      bgm.volume = BGM_TARGET * p;
      if(p < 1) window.requestAnimationFrame(step);
    }
    window.requestAnimationFrame(step);
  }

  var ICON_SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor" stroke="none"/><path d="M16 8.5a5 5 0 010 7"/><path d="M18.7 5.8a9 9 0 010 12.4"/></svg>';
  var ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor" stroke="none"/><path d="M16.2 9.2l5.6 5.6M21.8 9.2l-5.6 5.6"/></svg>';

  var muteBtn = document.getElementById('muteBtn');
  if(muteBtn){ muteBtn.innerHTML = ICON_SOUND_ON; }
  muteBtn.addEventListener('click', function(){
    bgm.muted = !bgm.muted;
    muteBtn.innerHTML = bgm.muted ? ICON_SOUND_OFF : ICON_SOUND_ON;
  });

  var cover = document.getElementById('cover');
  var started = false;
  function enterInvite(){
    if(started) return;
    started = true;
    cover.classList.add('dismissed');
    playDing();
    bgm.volume = 0;
    bgm.play().catch(function(){});
    window.setTimeout(fadeInMusic, 500);
    next();
  }
  document.getElementById('launcherBtn').addEventListener('click', function(e){ e.stopPropagation(); enterInvite(); });
})();
</script>

</body></html>
